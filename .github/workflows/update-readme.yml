name: Update Profile README

on:
  schedule:
    # off the hour, since top-of-hour cron runs get queued behind everyone else's
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-readme.mjs'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      # the runner image already ships a node new enough for fetch, so no setup-node
      - name: Update README
        run: node scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "chore: update readme stats"
          git push
